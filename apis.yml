aid: all-sports-api
url: >-
  https://raw.githubusercontent.com/api-evangelist/all-sports-api/refs/heads/main/apis.yml
modified: '2026-04-19'
name: All Sports API
description: >-
  All Sports API is a fast, reliable, and comprehensive sports data API
  providing livescore feeds, fixtures, standings, and historical data for major
  sports worldwide. The platform offers JSON pull-based APIs for football
  (soccer), basketball, cricket, and tennis, with hockey, baseball, and American
  football available as additional sports. The API base URL is
  apiv2.allsportsapi.com and uses API key authentication with sport-specific
  endpoints accessed via the met query parameter. All Sports API also provides
  free embeddable widgets (results, fixtures, standings, livescore) and
  WordPress plugins. Plans include a 14-day free trial.
apis:
  - aid: all-sports-api:football-api
    name: All Sports Football API
    description: >-
      The All Sports Football (Soccer) API provides real-time and historical
      football data including livescores, fixtures, standings, team information,
      player statistics, and league data for major football leagues worldwide.
      Data is returned as JSON using a pull-based model with API key
      authentication.
    humanURL: https://allsportsapi.com/soccer-football-api
    baseURL: https://apiv2.allsportsapi.com/football
    tags:
      - Sports
      - Football
      - Soccer
      - Livescore
      - Fixtures
      - Standings
    properties:
      - type: Documentation
        url: https://allsportsapi.com/soccer-football-api-documentation
